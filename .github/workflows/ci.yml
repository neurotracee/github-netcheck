name: selfcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: 安卓构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 + 单元测试
        working-directory: android
        run: gradle assembleDebug test --no-daemon --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  static-checks:
    name: 底线自查（不许引第三方网络库 / 不许加权限 / 不许埋点）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查没有引入第三方网络库
        run: |
          set -e
          if grep -rInE "okhttp|retrofit|volley|ktor-client" android/app/build.gradle.kts android/app/src/main/java; then
            echo "::error::探测内核必须是原生 socket，不许引入第三方网络库（会让四段计时失真）"
            exit 1
          fi
          echo "OK：没有第三方网络库"

      - name: 检查没有统计 / 崩溃上报 / 广告 SDK
        run: |
          set -e
          if grep -rInE "firebase|umeng|bugly|appsflyer|sentry|amplitude|mixpanel" android/app/build.gradle.kts android/app/src/main; then
            echo "::error::本项目不允许任何统计/上报 SDK"
            exit 1
          fi
          echo "OK：没有统计/上报 SDK"

      - name: 检查权限清单
        run: |
          set -e
          allowed="INTERNET|ACCESS_NETWORK_STATE|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          perms=$(grep -oE 'android.permission.[A-Z_]+' android/app/src/main/AndroidManifest.xml || true)
          echo "清单里的权限：$perms"
          for p in $perms; do
            if ! echo "$p" | grep -qE "($allowed)"; then
              echo "::error::出现未预期的权限：$p（本项目的权限必须只有 INTERNET 与 ACCESS_NETWORK_STATE）"
              exit 1
            fi
          done
          echo "OK：权限只有 INTERNET 与 ACCESS_NETWORK_STATE"

  windows:
    name: Windows 脚本语法与底线自查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 语法解析
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\windows\netcheck.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "OK：netcheck.ps1 语法正确"

      - name: 不许往上报数据
        shell: pwsh
        run: |
          $bad = Select-String -Path .\windows\netcheck.ps1 -Pattern "Invoke-WebRequest|Invoke-RestMethod|UploadString|Start-BitsTransfer"
          if ($bad) {
            Write-Error "脚本里出现了会把数据发出去的命令：$($bad.Line)"
            exit 1
          }
          Write-Host "OK：没有上传行为"
